plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.hibernate.orm' version '7.2.4.Final'
	id 'org.graalvm.buildtools.native' version '0.11.4'
}

group = 'com.btoy'
version = '0.0.1'
description = 'introducing in to gradle'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
    manifest {
        attributes 'Main-Class': 'com.btoy.trial.TrialApplication'
        attributes 'Implementation-Version': project.version

    }
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation("org.springframework.boot:spring-boot-starter-validation:4.1.0-M3")

    implementation("io.jsonwebtoken:jjwt-api:${v_jjwt}")
    runtimeOnly ("io.jsonwebtoken:jjwt-impl:${v_jjwt}")
    runtimeOnly ("io.jsonwebtoken:jjwt-jackson:${v_jjwt}")

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	runtimeOnly 'org.postgresql:postgresql'

	annotationProcessor 'org.projectlombok:lombok'

	compileOnly 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    //developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
}

hibernate {
	enhancement {
		enableAssociationManagement = true
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
